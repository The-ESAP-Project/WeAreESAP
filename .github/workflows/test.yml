name: CI

on:
  push:
    branches: [master]
    paths:
      - 'weare-website/**'
      - 'story-website/**'
      - 'esap-ltd/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.nvmrc'
      - '.node-version'
      - '.dockerignore'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master, preview]
    paths:
      - 'weare-website/**'
      - 'story-website/**'
      - 'esap-ltd/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.nvmrc'
      - '.node-version'
      - '.dockerignore'
      - '.github/workflows/test.yml'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Check all workspace packages with Biome
        run: pnpm -r lint

  test-unit:
    name: Unit Tests (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [weare-website, story-website, esap-ltd]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ${{ matrix.site }} run prebuild
      - name: Run unit tests with coverage
        if: matrix.site == 'weare-website'
        run: pnpm --dir weare-website exec vitest run --coverage
      - name: Run unit tests (allow sites without test files)
        if: matrix.site != 'weare-website'
        run: pnpm --dir ${{ matrix.site }} exec vitest run --passWithNoTests
      - uses: actions/upload-artifact@v7.0.2
        if: always() && matrix.site == 'weare-website'
        with:
          name: coverage-report
          path: weare-website/coverage/
          retention-days: 30

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir weare-website exec playwright install --with-deps chromium firefox
      - run: pnpm --dir weare-website run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: playwright-report
          path: weare-website/playwright-report/
          retention-days: 30

  build:
    name: Build (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [weare-website, story-website, esap-ltd]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ${{ matrix.site }} run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Check standalone server
        run: test -f '${{ matrix.site }}/.next/standalone/${{ matrix.site }}/server.js'

  docker:
    name: Docker (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [weare-website, story-website, esap-ltd]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --pull -f '${{ matrix.site }}/Dockerfile' -t esap-site .
      - name: Check runtime version and container health
        run: |
          docker run --rm esap-site --version
          container_id=$(docker run -d -e PORT=3080 esap-site)
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          for _ in {1..20}; do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$health" = healthy ]; then
              exit 0
            fi
            sleep 3
          done
          exit 1

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-e2e, build, docker]
    if: always()
    steps:
      - name: Check if all jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.test-unit.result }}
          E2E_RESULT: ${{ needs.test-e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          for result in "$LINT_RESULT" "$UNIT_RESULT" "$E2E_RESULT" "$BUILD_RESULT" "$DOCKER_RESULT"; do
            if [ "$result" != success ]; then
              echo 'CI failed'
              exit 1
            fi
          done
